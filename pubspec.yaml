name: culinary_pro
description: "A modern CulinaryPro built with Flutter and Provider."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  youtube_player_flutter: ^9.1.3
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  cloudinary: ^1.0.0
  image_picker: ^1.1.2
  http: ^1.6.0
  translator: ^1.0.4+1
  google_sign_in: ^6.2.2
  firebase_storage: ^13.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: "^0.13.1" # gunakan versi terbaru
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
